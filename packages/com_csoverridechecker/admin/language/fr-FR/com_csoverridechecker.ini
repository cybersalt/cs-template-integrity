COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker &mdash; Guide de configuration"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Utilisez l'IA que vous avez déjà"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Cette extension n'est liée à aucune IA en particulier. Tout ce qu'elle expose est une simple API REST sécurisée par un token API Joomla standard, donc tout assistant capable d'effectuer une requête web peut exécuter une révision &mdash; et un script que vous écrivez vous-même le peut aussi. Cette page couvre les différences pratiques entre les options afin que vous puissiez en choisir une et vous lancer."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Ce que votre assistant doit réellement être capable de faire"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Plutôt que de lister les produits qui fonctionnent &mdash; les offres et les fonctionnalités changent constamment &mdash; voici le véritable prérequis. Votre assistant doit pouvoir :"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Effectuer des requêtes HTTPS sortantes</strong> vers ce site, en envoyant un en-tête de requête personnalisé (<code>X-Joomla-Token</code>). C'est la seule exigence stricte."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Envoyer des requêtes POST avec un corps JSON</strong>, si vous voulez qu'il applique des correctifs plutôt que de seulement produire un rapport. Une révision en lecture seule n'a besoin que de GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Tenir une conversation assez longue</strong>, puisqu'il récupère deux fichiers pour chaque surcharge signalée avant de rendre un verdict."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Vous ne savez pas si le vôtre remplit les conditions ? Collez simplement le prompt et voyez. Un assistant qui ne peut pas joindre votre site le dira tout de suite plutôt que d'échouer en silence."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Aucun token API Joomla enregistré pour l'instant."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Quel que soit l'assistant que vous choisissez, il a besoin d'un token API Joomla pour lire vos fichiers de surcharge. Générez-en un dans <em>Système &rarr; Gestion &rarr; Utilisateurs &rarr; votre utilisateur &rarr; Token API Joomla</em>, puis collez-le dans le prompt à chaque fois ou enregistrez-le ici pour que le prompt se remplisse automatiquement."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Recommandé"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Le plus courant"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Idéal pour plusieurs sites"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Fonctionne, avec des réserves"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Avancé"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Agents de terminal et d'éditeur"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Par exemple : Claude Code, Codex CLI, Cursor, le mode agent de GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="L'option la plus fluide, et celle que nous suggérerions si vous en avez une à disposition. Ces agents s'exécutent sur votre propre machine avec un accès réseau sortant sans restriction, sans liste blanche de sandbox ni délai d'expiration de requête navigateur, donc une longue révision se déroule du début à la fin sans surveillance."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Copiez le prompt de scan depuis le tableau de bord."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Collez-le dans votre agent et envoyez. Aucune configuration n'est nécessaire."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Quand le rapport apparaît, répondez dans la même session en indiquant les numéros des découvertes que vous voulez corriger."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Assistants de chat dans le navigateur"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Par exemple : ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Tous fonctionnent, à condition que le compte et le mode que vous utilisez puissent réellement accéder à Internet. C'est la configuration la plus courante et parfaitement adaptée à un site normal."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Assurez-vous que l'accès web ou la navigation est activé pour la conversation. Certains niveaux et certains modes répondent uniquement de mémoire."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Collez le prompt de scan depuis le tableau de bord et envoyez."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Si votre site comporte beaucoup de surcharges, demandez-lui de les traiter par lots afin qu'une seule réponse ne dépasse pas le délai d'expiration de requête du navigateur."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Méfiez-vous des suppositions énoncées avec assurance.</strong> Si l'assistant se met à produire des découvertes sans jamais citer le contenu réel des fichiers, c'est qu'il ne peut pas joindre votre site et qu'il les invente. Arrêtez-vous et vérifiez sa connectivité plutôt que de faire confiance au rapport. <strong>Concernant Claude.ai en particulier :</strong> s'il répond &ldquo;Host not in allowlist&rdquo;, ajoutez le domaine de ce site dans <em>Paramètres &rarr; Capacités &rarr; Exécution de code &rarr; Accès réseau</em>, puis démarrez un nouveau chat &mdash; celui en cours conserve l'ancienne liste blanche."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="GPT personnalisés, Gems et autres assistants configurables"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Par exemple : un GPT personnalisé avec des Actions, un Gem Gemini, ou tout assistant qui vous permet d'enregistrer votre propre API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Si votre plateforme vous permet de définir un assistant avec ses propres actions API, enregistrez une seule fois les points d'accès ci-dessous et sautez complètement l'étape du copier-coller. C'est l'option la plus élégante si vous gérez plusieurs sites Joomla, car l'assistant se souvient de la configuration d'une conversation à l'autre."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Créez un nouvel assistant personnalisé et ajoutez une action API pointant vers l'URL du point d'accès indiquée plus bas sur cette page."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Définissez le nom de l'en-tête d'authentification sur <code>X-Joomla-Token</code> et collez votre token API Joomla comme valeur."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Collez le prompt de scan du tableau de bord dans les instructions de l'assistant afin qu'il connaisse les règles de classification et le format du rapport."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Modèles locaux et auto-hébergés"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Par exemple : Ollama, LM Studio, llama.cpp, ou tout modèle auto-hébergé avec appel d'outils"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Tout ce qui dispose de l'appel d'outils et d'un accès réseau fonctionnera mécaniquement, et rien ne quitte votre propre infrastructure, ce que certains sites préféreront."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Activez l'appel d'outils ou de fonctions et vérifiez que le modèle peut joindre ce site en HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Collez le prompt de scan comme prompt système, puis demandez-lui de commencer."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Soyez réaliste quant à la taille du modèle.</strong> Réviser une surcharge est une tâche de jugement, pas une simple recherche. Un petit modèle local produira volontiers un rapport, mais il est bien plus susceptible de manquer une véritable régression de sécurité ou d'en inventer une qui n'existe pas. Considérez les découvertes d'un petit modèle comme une première passe, pas comme un verdict."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Clients MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Tout assistant qui parle le Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Si votre assistant prend en charge MCP, notre extension compagnon <strong>MCP for Joomla</strong> expose l'outillage de ce site de cette façon et supprime complètement l'étape du copier-coller. C'est une extension gratuite distincte &mdash; installez-la à côté de celle-ci."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="La Méthode 2 est la seule exception"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Le bouton <em>Exécuter un scan automatique</em> du tableau de bord exécute toute la révision côté serveur, sans copier-coller. Ce chemin appelle directement l'API d'Anthropic, c'est donc la seule partie de cette extension qui exige un fournisseur précis &mdash; elle a besoin d'une clé API Anthropic et ne fonctionnera pas avec une clé OpenAI, Google ou d'un autre fournisseur. Si vous préférez utiliser un autre assistant, utilisez la Méthode 1 ci-dessus ; elle ne coûte rien de plus et produit le même rapport."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Clé Anthropic enregistrée &mdash; Méthode 2 disponible"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Aucune clé Anthropic enregistrée &mdash; la Méthode 1 fonctionne toujours"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Point d'accès et authentification"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Tout ce que fait l'interface d'administration est disponible sur cette URL de base. Utilisez-la lors de l'enregistrement d'un assistant personnalisé, ou quand vous écrivez votre propre script ou agent."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla n'accepte pas <code>Authorization: Bearer</code> sur ces routes.</strong> Vous devez envoyer le token dans l'en-tête <code>X-Joomla-Token</code>. Un en-tête au format Bearer renvoie 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Documentation complète"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Référence complète des points d'accès, format du rapport, dépannage et FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Lire la documentation"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker &mdash; Obtenir de l'aide"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Cette extension est gratuite, et le restera"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Il n'y a pas de version Pro, pas de clé de licence et aucune fonctionnalité mise de côté. Tout ce que l'extension sait faire est devant vous. Nous aimerions néanmoins beaucoup avoir de vos nouvelles &mdash; ce sont les retours de sites réels qui ont façonné chaque version jusqu'ici."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="À quoi s'attendre."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt est une petite entreprise et cette extension est offerte gratuitement, le support gratuit est donc assuré selon le temps disponible entre les travaux clients. C'est une contrainte réelle et non une façon de vous éconduire &mdash; nous préférons le dire franchement plutôt que de vous laisser attendre une promesse que nous ne pouvons pas tenir. Les rapports de bug sont examinés ; l'aide ouverte à la configuration ne le sera peut-être pas."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Où l'envoyer"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Rapports de bug, formulations confuses, une découverte que l'IA a mal jugée, un workflow auquel l'extension ne convient pas, ou un assistant qui s'est comporté de façon inattendue &mdash; tout cela est utile."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Signaler un problème sur GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Lire la documentation"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues est le meilleur endroit pour tout ce qui est reproductible, parce que c'est public &mdash; la prochaine personne ayant le même problème trouve la réponse au lieu de reposer la question."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Quoi inclure"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Vous obtiendrez une réponse plus rapide si vous nous aidez à sauter l'étape du diagnostic :"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="Le <strong>bloc de diagnostics</strong> de cette page (il contient vos versions de Joomla, de PHP et de l'extension en un seul copier-coller)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Quelle méthode</strong> vous avez utilisée &mdash; le prompt à copier-coller, le scan automatique, ou votre propre code &mdash; et <strong>quel assistant IA</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Ce que vous <strong>attendiez</strong>, et ce qui s'est <strong>réellement</strong> passé."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Si l'IA s'est trompée sur une découverte, le <strong>rapport de session enregistré</strong> &mdash; utilisez <em>Télécharger le rapport</em> sur la page de la session. Cela nous donne les découvertes et le raisonnement exacts à examiner."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Les idées sont également les bienvenues"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Si l'extension fait presque ce dont vous avez besoin mais pas tout à fait, dites-le-nous. Plusieurs fonctionnalités ont vu le jour parce qu'une personne a décrit un workflow auquel nous n'avions pas pensé."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnostics"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Copiez ceci dans votre rapport pour que nous n'ayons pas à le demander."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Copier les diagnostics"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Ce bloc ne contient aucun secret. Il indique seulement si une clé ou un token est enregistré, jamais sa valeur."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Affichage dans {seconds} s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Délai de maintien pour afficher (secondes)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Les clés et tokens affichés dans cette extension sont floutés par défaut afin qu'un partage d'écran, un screencast ou un regard par-dessus l'épaule ne les divulgue pas. Maintenez votre pointeur sur une valeur floutée pendant ce nombre de secondes et elle s'affiche ; un compte à rebours vous indique que le minuteur tourne. S'éloigner l'annule. Par défaut <strong>3</strong>. Mettez <strong>0</strong> pour afficher immédiatement au survol, ce qui supprime la protection contre un simple passage du pointeur sur la valeur."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Masquage automatique après affichage (secondes)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Une fois qu'une valeur a été affichée, la flouter à nouveau après ce nombre de secondes même si le pointeur est toujours dessus. Couvre le cas où vous jetez un œil à une clé puis êtes interrompu, la laissant exposée sur un écran sans surveillance. Par défaut <strong>8</strong>. Mettez <strong>0</strong> pour la garder visible jusqu'à ce que vous vous éloigniez."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Fournisseur d'IA"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Le service d'IA qu'appelle le bouton intégré <em>Exécuter un scan automatique</em>. Vous fournissez votre propre clé pour celui que vous choisissez, et elle n'est utilisée que depuis ce site. Ce paramètre n'affecte <strong>pas</strong> le workflow du prompt à copier-coller &mdash; celui-ci fonctionne avec n'importe quelle IA et ne nécessite aucune clé."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Les trois fournisseurs peuvent exécuter un scan.</strong> Le chat de suivi sur une session &mdash; où vous lui demandez d'appliquer des correctifs et où il modifie des fichiers via des appels d'outils &mdash; est actuellement <strong>réservé à Anthropic</strong>, parce que cette boucle est écrite pour le protocole d'appel d'outils d'Anthropic. Avec OpenAI ou Gemini sélectionné, vous obtenez tout de même le rapport complet ; pour que les correctifs soient appliqués à votre place, basculez ce paramètre sur Anthropic ou utilisez le workflow du prompt à copier-coller, qui fonctionne avec n'importe quelle IA."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Clé API OpenAI"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Votre clé API OpenAI personnelle (commence par <code>sk-</code>). Obtenez-en une sur <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Stockée sur ce serveur et utilisée uniquement pour appeler api.openai.com en votre nom."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Clé API Google Gemini"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Votre clé API Google AI Studio personnelle. Obtenez-en une sur <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Stockée sur ce serveur et utilisée uniquement pour appeler l'API Gemini en votre nom."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — le plus capable, par défaut."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — plus rapide et moins cher. Convient aux scans à faible enjeu."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — le plus capable, par défaut."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — plus rapide et moins cher. Convient aux scans à faible enjeu."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Aucune clé API enregistrée pour %s. Ajoutez-en une dans les Options, ou changez de fournisseur."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="Vous n'avez pas la permission de récupérer un token API. Cette action nécessite la permission de modification d'Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Aucun utilisateur connecté n'a pu être identifié, il n'y a donc aucun token à récupérer."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="Le plugin <strong>Utilisateur - Token API Joomla</strong> est désactivé, Joomla ne peut donc pas encore émettre de token API. Activez-le et réessayez."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Votre token a été émis, mais le plugin <strong>Authentification API - Token API Joomla</strong> est désactivé, Joomla rejettera donc le token sur les requêtes API entrantes tant que vous n'aurez pas activé ce plugin aussi."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Vos groupes d'utilisateurs ne figurent pas sur la liste d'autorisation du plugin Utilisateur - Token API Joomla, Joomla ne vous délivrera donc pas de token. Ajoutez l'un de vos groupes au paramètre Groupes d'utilisateurs autorisés de ce plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Ce site n'a aucun secret défini dans configuration.php, un token API ne peut donc pas être dérivé."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ERROR="Impossible de récupérer votre token API Joomla : %s"
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_NOT_FOUND="Le plugin Utilisateur - Token API Joomla n'est pas installé sur ce site."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ALREADY="Le plugin Utilisateur - Token API Joomla était déjà activé."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_SUCCESS="Le plugin Utilisateur - Token API Joomla a été activé."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ERROR="Impossible d'activer le plugin Utilisateur - Token API Joomla : %s"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON="Récupérer mon token API Joomla"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Récupération…"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="Activer le plugin de token"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_CREATED_NOTICE="Un nouveau token API Joomla a été généré pour votre compte."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_EXISTING_NOTICE="Voici le token API Joomla existant de votre compte."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Traitez ce token comme un mot de passe. Il vous authentifie sur l'ensemble de l'API Web Services de Joomla. Envoyez-le uniquement dans l'en-tête X-Joomla-Token, jamais dans une URL."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_NOT_FOUND="Le plugin Authentification API - Token API Joomla n'est pas installé sur ce site."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ALREADY="Le plugin Authentification API - Token API Joomla était déjà activé."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_SUCCESS="Le plugin Authentification API - Token API Joomla a été activé. Votre token API sera désormais accepté sur les requêtes entrantes."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ERROR="Impossible d'activer le plugin Authentification API - Token API Joomla : %s"
COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="L'activation d'un plugin Joomla est une modification qui affecte tout le site : elle nécessite donc l'autorisation Joomla de gestion des plugins en plus de l'accès à ce composant. Demandez à un Super Utilisateur d'activer le plugin ou d'accorder à votre groupe les droits de gestion sur les Plugins."
