COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="Cliquez sur <em>Télécharger la sauvegarde</em> ci-dessus (ou copiez le bloc Contenu de la sauvegarde)."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="Ouvrez votre client FTP, client SFTP ou gestionnaire de fichiers d'hébergement."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="Remplacez le fichier au chemin de destination ci-dessous par la copie téléchargée."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_DESTINATION="Chemin de destination sur le serveur"

COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Où vit cette sauvegarde"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Le contenu des sauvegardes est stocké dans la base de données, pas sur le disque. Plus précisément, dans la table <code>#__csoverridechecker_backups</code> — la colonne <code>contents_b64</code> contient le contenu du fichier base64-encodé."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Cela signifie qu'une sauvegarde de base de données les capture également. Désinstaller le composant supprime la table avec toutes les sauvegardes stockées."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>À propos de votre niveau d'API Anthropic :</strong> le scan automatique et les fonctions de chat comptent tous deux dans la limite de tokens par minute d'Anthropic. Le Tier 1 par défaut d'Anthropic (10 000 tokens d'entrée par minute) suffit pour un scan unique sur un petit site, mais imposera une limite de débit pendant les correctifs en chat à plusieurs tours. Le Tier 2 (50 000 tokens par minute, facturé) est confortable pour la plupart des vraies sessions de correction. Consultez votre niveau actuel sur <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Réinitialiser les surcharges pour révision"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Choisissez le ou les modèles pour lesquels reconstruire le suivi des surcharges. Seuls les modèles activés qui possèdent un dossier de surcharges <code>html/</code> sur le disque sont listés. Cochez <em>Sélectionner tout</em> pour le comportement d'origine &ldquo;réinitialiser tous les modèles&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Aucun modèle activé sur ce site ne possède de dossier de surcharges <code>html/</code>, il n'y a donc rien à réinitialiser. Ajoutez une surcharge (ou activez un modèle qui en possède) puis rouvrez cette fenêtre."
